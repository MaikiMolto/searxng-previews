name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run ESLint on backend
      run: |
        cd packages/backend
        npm run lint --if-present || echo "No lint script found, skipping"
    
    - name: Run ESLint on extension
      run: |
        cd packages/extension
        npm run lint --if-present || echo "No lint script found, skipping"

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run backend tests
      run: |
        cd packages/backend
        npm test --if-present || echo "No test script found, skipping"

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: test-backend
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build backend
      run: |
        cd packages/backend
        npm run build --if-present || echo "No build script found, skipping"

  build-extension:
    name: Build Extension
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build extension
      run: |
        cd packages/extension
        npm run build --if-present || echo "No build script found, skipping"

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build-backend, build-extension]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/maikimolto/searxng-previews
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
    
    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./packages/backend/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  docker-push:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Check Docker image
      run: |
        echo "Docker image pushed to GHCR"
        echo "Tags: ghcr.io/maikimolto/searxng-previews:latest"
        echo "Tags: ghcr.io/maikimolto/searxng-previews:${{ github.sha }}"

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [lint, test-backend, build-backend, build-extension]
    if: always()
    
    steps:
    - name: Print summary
      run: |
        echo "CI Pipeline Summary"
        echo "==================="
        echo "Lint: ${{ needs.lint.result }}"
        echo "Test Backend: ${{ needs.test-backend.result }}"
        echo "Build Backend: ${{ needs.build-backend.result }}"
        echo "Build Extension: ${{ needs.build-extension.result }}"
        
        if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "Docker Build: ${{ needs.docker-build.result }}"
          echo "Docker Push: ${{ needs.docker-push.result }}"
        fi